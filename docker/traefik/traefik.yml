# API and Dashboard (disabled for security)
api:
  dashboard: false

# Entry Points
entryPoints:
  web:
    address: ":80"
    # Redirect HTTP to HTTPS
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"

# Docker Provider
providers:
  docker:
    exposedByDefault: false
    network: web

# Let's Encrypt Certificate Resolver
certificatesResolvers:
  letsencrypt:
    acme:
      email: jpvoogt@gmail.com
      storage: /acme.json
      # DNS Challenge for Cloudflare
      dnsChallenge:
        provider: cloudflare
        delayBeforeCheck: 10s
